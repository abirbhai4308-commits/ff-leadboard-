<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☠『TG』ꜱQᴜᴀ德☠ - Tournament Leaderboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Orbitron', sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% -20%, #1a253f 0%, #080b12 100%);
            color: #ffcc00;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .main-wrapper {
            width: 100%;
            max-width: 580px;
            background: rgba(13, 19, 33, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 204, 0, 0.3);
            border-radius: 18px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 20px rgba(255, 204, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .main-wrapper::after {
            content: '';
            position: absolute;
            bottom: -40px;
            left: 10%;
            width: 80%;
            height: 20px;
            background: rgba(255, 204, 0, 0.2);
            filter: blur(15px);
            border-radius: 50%;
            z-index: -1;
        }

        .top-badge {
            background: linear-gradient(135deg, rgba(255, 100, 0, 0.2), rgba(255, 204, 0, 0.2));
            border: 1px solid rgba(255, 204, 0, 0.4);
            color: #ffcc00;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 5px 16px;
            border-radius: 15px;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }

        .header-title {
            color: #ffcc00;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.8), 0 0 20px rgba(255, 204, 0, 0.5);
        }

        .header-subtitle {
            color: #a1aabf;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 4px;
            text-align: center;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .tab {
            background: rgba(255,255,255, 0.05);
            color: #ffcc00;
            border: 1px solid rgba(255, 204, 0, 0.3);
            padding: 10px 18px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        .tab.active {
            background: #ffcc00;
            color: #080b12;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.9);
            border-color: #ffcc00;
            transform: translateY(-3px) scale(1.05);
        }

        .table-box {
            width: 100%;
            border: 1px solid rgba(255, 204, 0, 0.3);
            border-radius: 14px;
            padding: 20px;
            background: rgba(19, 27, 46, 0.5);
            backdrop-filter: blur(5px);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
            min-height: 150px;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px;
            text-align: center;
        }

        th {
            color: #ffcc00;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 10px 8px;
            border-bottom: 2px solid rgba(255, 204, 0, 0.3);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        td {
            padding: 16px 10px;
            background: linear-gradient(90deg, rgba(22, 34, 59, 0.7) 0%, rgba(26, 39, 68, 0.7) 100%);
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: 700;
            border-top: 1px solid rgba(255, 204, 0, 0.15);
            border-bottom: 1px solid rgba(255, 204, 0, 0.15);
        }

        .loading-text {
            text-align: center;
            color: #ffcc00;
            font-size: 0.85rem;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="top-badge">🔥 FREE FIRE DUO CUP 🔥</div>
        <div class="header-title">☠『TG』ꜱQᴜᴀ德☠</div>
        <div class="header-subtitle">TOURNAMENT LEADERBOARD</div>

        <div class="nav-tabs">
            <button class="tab active" onclick="switchTab(this, 'Teams')">Teams</button>
            <button class="tab" onclick="switchTab(this, 'Champion')">🏆 Champion</button>
        </div>

        <div class="table-box" id="content-box">
            <div class="loading-text">Loading from Google Sheet...</div>
        </div>
    </div>

    <script>
        // আপনার গুগল শিটের আইডি দিয়ে এপিআই লিংক তৈরি করা হয়েছে
        const API_URL = "https://sheetdb.io/api/v1/1f1x4iXYMJOg6r56dy_eZfQ-PTvJzYF2TQcRL-5pDfi8"; 

        let cachedData = [];

        async function fetchSheetData() {
            try {
                const response = await fetch(API_URL);
                cachedData = await response.json();
                renderTeamsTable();
            } catch (error) {
                document.getElementById('content-box').innerHTML = `<div class="loading-text">Failed to load data from Sheet.</div>`;
            }
        }

        function renderTeamsTable() {
            let rows = "";
            if(!Array.isArray(cachedData) || cachedData.length === 0) {
                rows = `<tr><td colspan="5">No data found in sheet</td></tr>`;
            } else {
                cachedData.forEach((item, index) => {
                    rows += `
                        <tr>
                            <td>${index + 1}</td>
                            <td>${item.team || '--'}</td>
                            <td>${item.group || '--'}</td>
                            <td>${item.player1 || '--'}</td>
                            <td>${item.player2 || '--'}</td>
                        </tr>
                    `;
                });
            }

            document.getElementById('content-box').innerHTML = `
                <table>
                    <thead>
                        <tr><th>#</th><th>TEAM NAME</th><th>GROUP</th><th>PLAYER 1 (LEADER)</th><th>PLAYER 2</th></tr>
                    </thead>
                    <tbody>
                        ${rows}
                    </tbody>
                </table>
            `;
        }

        function switchTab(button, tabName) {
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(t => t.classList.remove('active'));
            button.classList.add('active');

            const contentBox = document.getElementById('content-box');

            if(tabName === 'Teams') {
                renderTeamsTable();
            } else if(tabName === 'Champion') {
                contentBox.innerHTML = `
                    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; padding:35px 15px;">
                        <div style="font-size:3.5rem; margin-bottom:10px;">🏆</div>
                        <div style="font-size:2rem; font-weight:900; color:#ffcc00; letter-spacing:4px; text-shadow:0 0 15px #ffcc00;">CHAMPION</div>
                        <div style="font-size:0.9rem; color:#fff; letter-spacing:2px; font-weight:700; margin-top:5px;">👑 TG SQUAD CHAMPIONS 👑</div>
                    </div>
                `;
            }
        }

        window.onload = function() {
            fetchSheetData();
        };
    </script>
</body>
</html>
