<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☠『TG』ꜱQᴜᴀ德☠ - Tournament Leaderboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Orbitron', sans-serif; }
        body { background: radial-gradient(circle at 50% -20%, #1a253f 0%, #080b12 100%); color: #ffcc00; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; overflow-x: hidden; }
        .main-wrapper { width: 100%; max-width: 580px; background: rgba(13, 19, 33, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 204, 0, 0.3); border-radius: 18px; padding: 40px 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 20px rgba(255, 204, 0, 0.1); display: flex; flex-direction: column; align-items: center; position: relative; }
        .top-badge { background: linear-gradient(135deg, rgba(255, 100, 0, 0.2), rgba(255, 204, 0, 0.2)); border: 1px solid rgba(255, 204, 0, 0.4); color: #ffcc00; font-size: 0.7rem; font-weight: 700; padding: 5px 16px; border-radius: 15px; letter-spacing: 2px; margin-bottom: 25px; text-transform: uppercase; }
        .header-title { color: #ffcc00; font-size: 1.8rem; font-weight: 900; letter-spacing: 3px; text-align: center; margin-bottom: 8px; text-shadow: 0 0 10px rgba(255, 204, 0, 0.8); }
        .header-subtitle { color: #a1aabf; font-size: 0.75rem; font-weight: 600; letter-spacing: 4px; text-align: center; margin-bottom: 30px; text-transform: uppercase; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 30px; justify-content: center; width: 100%; }
        .tab { background: rgba(255,255,255, 0.05); color: #ffcc00; border: 1px solid rgba(255, 204, 0, 0.3); padding: 10px 18px; font-size: 0.75rem; font-weight: 700; border-radius: 10px; cursor: pointer; text-transform: uppercase; }
        .tab.active { background: #ffcc00; color: #080b12; box-shadow: 0 0 20px rgba(255, 204, 0, 0.9); }
        .table-box { width: 100%; border: 1px solid rgba(255, 204, 0, 0.3); border-radius: 14px; padding: 20px; background: rgba(19, 27, 46, 0.5); }
        table { width: 100%; border-collapse: separate; border-spacing: 0 10px; text-align: center; }
        th { color: #ffcc00; font-size: 0.7rem; font-weight: 800; padding: 10px 8px; border-bottom: 2px solid rgba(255, 204, 0, 0.3); letter-spacing: 2px; }
        td { padding: 16px 10px; background: linear-gradient(90deg, rgba(22, 34, 59, 0.7) 0%, rgba(26, 39, 68, 0.7) 100%); color: #ffffff; font-size: 0.8rem; font-weight: 700; border: 1px solid rgba(255, 204, 0, 0.15); }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="top-badge">🔥 FREE FIRE DUO CUP 🔥</div>
        <div class="header-title">☠『TG』ꜱQᴜᴀ德☠</div>
        <div class="header-subtitle">TOURNAMENT LEADERBOARD</div>

        <div class="nav-tabs">
            <button class="tab active" onclick="switchTab(this, 'Teams')">Teams</button>
            <button class="tab" onclick="switchTab(this, 'Champion')">🏆 Champion</button>
        </div>

        <div class="table-box" id="content-box">
            <!-- এখানে আপনার দলগুলোর নাম বসবে -->
        </div>
    </div>

    <script>
        // আপনি শুধু এই নিচের নামগুলো পরিবর্তন করলেই ওয়েবসাইটে সেটা সাথে সাথে দেখাবে!
        const teamsData = [
            { rank: 1, team: "TG Viper", group: "A", p1: "Abir", p2: "Razu" },
            { rank: 2, team: "TG King", group: "B", p1: "Fahim", p2: "Sakib" },
            { rank: 3, team: "Team Alpha", group: "A", p1: "Player 5", p2: "Player 6" }
        ];

        function renderTeams() {
            let rows = "";
            teamsData.forEach(item => {
                rows += `<tr>
                    <td>${item.rank}</td>
                    <td>${item.team}</td>
                    <td>${item.group}</td>
                    <td>${item.p1}</td>
                    <td>${item.p2}</td>
                </tr>`;
            });

            document.getElementById('content-box').innerHTML = `
                <table>
                    <thead>
                        <tr><th>#</th><th>TEAM NAME</th><th>GROUP</th><th>PLAYER 1 (LEADER)</th><th>PLAYER 2</th></tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            `;
        }

        function switchTab(button, tabName) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            button.classList.add('active');

            if(tabName === 'Teams') {
                renderTeams();
            } else {
                document.getElementById('content-box').innerHTML = `
                    <div style="text-align:center; padding:35px;">
                        <div style="font-size:3.5rem; margin-bottom:10px;">🏆</div>
                        <div style="font-size:1.8rem; font-weight:900; color:#ffcc00; letter-spacing:3px;">CHAMPION</div>
                        <div style="font-size:0.9rem; color:#fff; margin-top:5px; font-weight:700;">👑 TG SQUAD CHAMPIONS 👑</div>
                    </div>
                `;
            }
        }

        window.onload = renderTeams;
    </script>
</body>
</html>
