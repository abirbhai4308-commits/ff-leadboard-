<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☠『TG』ꜱQᴜᴀD☠ - Tournament Leadboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Orbitron', sans-serif;
        }

        body {
            background: radial-gradient(circle at 50% -20%, #1a253f 0%, #080b12 100%);
            color: #ffcc00;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* Main Outer Box - Glassmorphism Upgrade */
        .main-wrapper {
            width: 100%;
            max-width: 580px;
            background: rgba(13, 19, 33, 0.6); /* Semi-transparent background */
            backdrop-filter: blur(12px); /* The glass blur effect */
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 204, 0, 0.3);
            border-radius: 18px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5), 0 0 20px rgba(255, 204, 0, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Neon Floor Reflection Effect */
        .main-wrapper::after {
            content: '';
            position: absolute;
            bottom: -40px;
            left: 10%;
            width: 80%;
            height: 20px;
            background: rgba(255, 204, 0, 0.2);
            filter: blur(15px);
            border-radius: 50%;
            z-index: -1;
        }

        /* Top Badge - Sleeker Design */
        .top-badge {
            background: linear-gradient(135deg, rgba(255, 100, 0, 0.2), rgba(255, 204, 0, 0.2));
            border: 1px solid rgba(255, 204, 0, 0.4);
            color: #ffcc00;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 5px 16px;
            border-radius: 15px;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }

        /* Header Style - Enhanced Glow */
        .header-title {
            color: #ffcc00;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-align: center;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.8), 0 0 20px rgba(255, 204, 0, 0.5);
        }

        .header-subtitle {
            color: #a1aabf;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 4px;
            text-align: center;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        /* Nav Tabs - Futuristic Buttons */
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .tab {
            background: rgba(255,255,255, 0.05);
            color: #ffcc00;
            border: 1px solid rgba(255, 204, 0, 0.3);
            padding: 10px 18px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
        }

        /* Hover sweep effect for tabs */
        .tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 204, 0, 0.2), transparent);
            transition: 0.5s;
        }

        .tab:hover:not(.active):before {
            left: 100%;
        }

        .tab.active {
            background: #ffcc00;
            color: #080b12;
            box-shadow: 0 0 20px rgba(255, 204, 0, 0.9);
            border-color: #ffcc00;
            transform: translateY(-3px) scale(1.05);
        }

        .tab:hover:not(.active) {
            border-color: rgba(255, 204, 0, 0.7);
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.2);
            transform: translateY(-1px);
        }

        /* Table Box Wrapper - Glassmorphism Upgrade */
        .table-box {
            width: 100%;
            border: 1px solid rgba(255, 204, 0, 0.3);
            border-radius: 14px;
            padding: 20px;
            background: rgba(19, 27, 46, 0.5);
            backdrop-filter: blur(5px);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
        }

        /* Table Styling */
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 10px; /* Space between rows */
            text-align: center;
        }

        th {
            color: #ffcc00;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 10px 8px;
            border-bottom: 2px solid rgba(255, 204, 0, 0.3);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        td {
            padding: 16px 10px;
            background: linear-gradient(90deg, rgba(22, 34, 59, 0.7) 0%, rgba(26, 39, 68, 0.7) 100%);
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: 700;
            border-top: 1px solid rgba(255, 204, 0, 0.15);
            border-bottom: 1px solid rgba(255, 204, 0, 0.15);
            transition: all 0.3s ease;
        }

        td:first-child {
            border-left: 1px solid rgba(255, 204, 0, 0.15);
            border-top-left-radius: 10px;
            border-bottom-left-radius: 10px;
        }

        td:last-child {
            border-right: 1px solid rgba(255, 204, 0, 0.15);
            border-top-right-radius: 10px;
            border-bottom-right-radius: 10px;
        }

        /* Row Hover Effect - Pulse & Glow */
        tr:hover td {
            background: linear-gradient(90deg, rgba(29, 44, 78, 0.9) 0%, rgba(35, 53, 93, 0.9) 100%);
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.2);
            transform: scale(1.01);
        }

        /* Grand Champion Banner Style - Royal Glow */
        .grand-champion-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 45px 20px;
            background: radial-gradient(circle, rgba(255, 204, 0, 0.15) 0%, rgba(19, 27, 46, 0.6) 100%);
            border: 2px solid #ffcc00;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.3), inset 0 0 15px rgba(255, 204, 0, 0.2);
            animation: borderPulse 2s infinite alternate;
        }

        .trophy-icon {
            font-size: 4rem;
            margin-bottom: 15px;
            animation: scaleUpDown 1.5s infinite ease-in-out;
            /* Supercharged Golden Glow */
            filter: drop-shadow(0 0 15px #ffcc00) drop-shadow(0 0 30px #ff9900);
        }

        .grand-title {
            font-size: 2.8rem;
            font-weight: 900;
            color: #ffcc00;
            letter-spacing: 6px;
            /* Deep Golden Text Shadow */
            text-shadow: 0 0 10px #ffcc00, 0 0 20px #ff9900, 0 0 30px #ff6600;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .champion-name {
            font-size: 1.1rem;
            color: #ffffff;
            letter-spacing: 3px;
            font-weight: 800;
            text-transform: uppercase;
            font-style: italic;
        }

        @keyframes borderPulse {
            0% { border-color: rgba(255, 204, 0, 0.3); }
            100% { border-color: rgba(255, 204, 0, 0.8); }
        }

        @keyframes scaleUpDown {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- Top Badge -->
        <div class="top-badge">🔥 FREE FIRE DUO CUP 🔥</div>

        <!-- Guild Title -->
        <div class="header-title">☠『TG』ꜱQᴜᴀD☠</div>
        <div class="header-subtitle">TOURNAMENT LEADBOARD</div>

        <!-- Navigation Buttons -->
        <div class="nav-tabs">
            <button class="tab active" onclick="switchTab(this, 'Teams')">Teams</button>
            <button class="tab" onclick="switchTab(this, 'Matches')">Matches</button>
            <button class="tab" onclick="switchTab(this, 'Point Table')">Point Table</button>
            <button class="tab champion" onclick="switchTab(this, 'Champion')">🏆 Champion</button>
        </div>

        <!-- Main Leaderboard Box -->
        <div class="table-box" id="content-box">
            <!-- Dynamic Content loads here -->
        </div>
    </div>

    <script>
        const tableData = {
            "Teams": `
                <table>
                    <thead>
                        <tr><th>#</th><th>TEAM NAME</th><th>GROUP</th><th>PLAYER 1 (LEADER)</th><th>PLAYER 2</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>1</td><td>--</td><td>--</td><td>--</td><td>--</td></tr>
                    </tbody>
                </table>
            `,
            "Matches": `
                <table>
                    <thead>
                        <tr><th>MATCH NO</th><th>GROUP</th><th>TEAM NAME</th><th>VS</th><th>TEAM NAME</th><th>WINNER</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>#01</td><td>--</td><td>--</td><td>VS</td><td>--</td><td>--</td></tr>
                    </tbody>
                </table>
            `,
            "Point Table": `
                <table>
                    <thead>
                        <tr><th>GROUP</th><th>POS</th><th>TEAM NAME</th><th>PLAYED</th><th>WON</th><th>LOST</th><th>PTS</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>--</td><td>01</td><td>--</td><td>0</td><td>0</td><td>0</td><td>0</td></tr>
                    </tbody>
                </table>
            `,
            "Champion": `
                <div class="grand-champion-wrapper">
                    <div class="trophy-icon">🏆</div>
                    <div class="grand-title">CHAMPION</div>
                    <div class="champion-name">👑 WINNING GUILD SQUAD / TEAM 👑</div>
                </div>
            `
        };

        function switchTab(button, tabName) {
            const tabs = document.querySelectorAll('.tab');
            tabs.forEach(t => t.classList.remove('active'));

            button.classList.add('active');

            document.getElementById('content-box').innerHTML = tableData[tabName];
        }

        // Page Load Default
        window.onload = function() {
            document.getElementById('content-box').innerHTML = tableData["Teams"];
        };
    </script>

</body>
</html>
